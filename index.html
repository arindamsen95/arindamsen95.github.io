<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arindam Sen - Postdoctoral Researcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #2d3436;
            background: #ffffff;
            overflow-x: hidden;
        }

        /* Smooth Scroll */
        .smooth-scroll {
            overflow: hidden;
        }

        .smooth-scroll-content {
            will-change: transform;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            padding: 1.2rem 2rem;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        nav .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2d3436;
            letter-spacing: -1px;
        }

        nav .logo span {
            color: #0984e3;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2.5rem;
        }

        nav ul li a {
            color: #2d3436;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
            position: relative;
        }

        nav ul li a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: #0984e3;
            transition: width 0.3s ease;
        }

        nav ul li a:hover::after {
            width: 100%;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            position: relative;
            overflow: hidden;
            padding-top: 60px;
        }

        .hero-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .hero-bg div {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
        }

        .blob1 {
            width: 300px;
            height: 300px;
            top: -100px;
            left: -100px;
        }

        .blob2 {
            width: 200px;
            height: 200px;
            bottom: -50px;
            right: -50px;
        }

        .hero-content {
            text-align: center;
            z-index: 10;
            position: relative;
        }

        .hero-image {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #ffffff;
            margin-bottom: 2rem;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            opacity: 0;
            animation: fadeInScale 0.8s ease-out forwards;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            font-weight: 800;
            letter-spacing: -2px;
            line-height: 1.1;
            opacity: 0;
            animation: slideUp 0.8s ease-out 0.2s forwards;
        }

        .hero .subtitle {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            font-weight: 400;
            opacity: 0;
            animation: slideUp 0.8s ease-out 0.4s forwards;
        }

        .hero .description {
            font-size: 1rem;
            opacity: 0.95;
            max-width: 600px;
            margin: 0 auto 2.5rem;
            opacity: 0;
            animation: slideUp 0.8s ease-out 0.6s forwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-buttons {
            margin-bottom: 2rem;
            opacity: 0;
            animation: slideUp 0.8s ease-out 0.8s forwards;
        }

        .btn {
            display: inline-block;
            padding: 0.9rem 2rem;
            margin: 0.5rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: #ffffff;
            color: #667eea;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
        }

        .btn-secondary:hover {
            background: #ffffff;
            color: #667eea;
        }

        .social-links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            opacity: 0;
            animation: slideUp 0.8s ease-out 1s forwards;
        }

        .social-links a {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .social-links a:hover {
            background: #ffffff;
            color: #667eea;
            transform: translateY(-5px);
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Sections */
        section {
            padding: 6rem 0;
        }

        section.dark {
            background: #2d3436;
            color: #ffffff;
        }

        section h2 {
            font-size: 2.8rem;
            margin-bottom: 1rem;
            font-weight: 800;
            letter-spacing: -1px;
            position: relative;
            display: inline-block;
        }

        section h2::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 60px;
            height: 4px;
            background: #0984e3;
            border-radius: 2px;
        }

        .section-header {
            margin-bottom: 3rem;
        }

        /* About Section */
        #about {
            background: #f8f9fa;
        }

        .about-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
            margin-top: 3rem;
        }

        .about-text h3 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: #2d3436;
            font-weight: 700;
        }

        .about-text p {
            margin-bottom: 1rem;
            color: #636e72;
            line-height: 1.8;
            font-size: 1rem;
        }

        .skills {
            margin-top: 2rem;
        }

        .skills h4 {
            margin-bottom: 1rem;
            color: #2d3436;
            font-weight: 700;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 2rem;
        }

        .skill-tag {
            background: #0984e3;
            color: #ffffff;
            padding: 0.6rem 1.2rem;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .skill-tag:hover {
            background: #667eea;
            transform: translateY(-2px);
        }

        /* Research Section */
        #research {
            background: #ffffff;
        }

        .research-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
            margin-top: 3rem;
        }

        .research-card {
            background: #f8f9fa;
            padding: 2.5rem;
            border-radius: 12px;
            border-left: 5px solid #0984e3;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            overflow: hidden;
            position: relative;
        }

        .research-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }

        .research-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            border-left-color: #667eea;
        }

        .research-card:hover::before {
            left: 100%;
        }

        .research-card h3 {
            color: #0984e3;
            margin-bottom: 0.8rem;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .research-card .year {
            color: #a29bfe;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .research-card p {
            color: #636e72;
            line-height: 1.7;
        }

        /* Publications Section */
        #publications {
            background: #f8f9fa;
        }

        .pub-list {
            list-style: none;
            margin-top: 2rem;
        }

        .pub-item {
            background: #ffffff;
            padding: 1.8rem;
            margin-bottom: 1.5rem;
            border-radius: 8px;
            border-left: 4px solid #e17055;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .pub-item::before {
            content: '';
            position: absolute;
            top: 0;
            right: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, transparent, rgba(225, 112, 85, 0.05), transparent);
            transition: right 0.4s ease;
        }

        .pub-item:hover {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            transform: translateX(5px);
        }

        .pub-item:hover::before {
            right: 100%;
        }

        .pub-item strong {
            color: #2d3436;
            font-weight: 700;
        }

        .pub-item em {
            color: #636e72;
            font-style: italic;
        }

        .pub-year {
            display: inline-block;
            background: #0984e3;
            color: #ffffff;
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-top: 0.8rem;
            font-weight: 600;
        }

        /* Education Section */
        #education {
            background: #ffffff;
        }

        .education-timeline {
            position: relative;
            padding: 2rem 0;
            margin-top: 3rem;
        }

        .timeline-item {
            margin-bottom: 3rem;
            padding-left: 3.5rem;
            position: relative;
            opacity: 0;
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .timeline-item:nth-child(1) { animation-delay: 0s; }
        .timeline-item:nth-child(2) { animation-delay: 0.1s; }
        .timeline-item:nth-child(3) { animation-delay: 0.2s; }
        .timeline-item:nth-child(4) { animation-delay: 0.3s; }
        .timeline-item:nth-child(5) { animation-delay: 0.4s; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 5px;
            width: 24px;
            height: 24px;
            background: #0984e3;
            border-radius: 50%;
            border: 4px solid #ffffff;
            box-shadow: 0 0 0 3px #0984e3;
        }

        .timeline-item::after {
            content: '';
            position: absolute;
            left: 11px;
            top: 24px;
            width: 2px;
            height: calc(100% + 2rem);
            background: #0984e3;
        }

        .timeline-item:last-child::after {
            display: none;
        }

        .timeline-item h4 {
            color: #2d3436;
            margin-bottom: 0.3rem;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .timeline-item .year {
            color: #a29bfe;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .timeline-item p {
            color: #636e72;
            font-size: 0.95rem;
        }

        /* Contact Section */
        #contact {
            background: linear-gradient(135deg, #2d3436 0%, #636e72 100%);
            color: #ffffff;
            text-align: center;
        }

        #contact h2,
        #contact h2::after {
            color: #ffffff;
        }

        #contact h2::after {
            background: #0984e3;
