<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arindam Sen - Postdoctoral Researcher</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #fff;
            overflow-x: hidden;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.98);
            padding: 1rem 2rem;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
        }

        nav .logo span {
            color: #3498db;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2.5rem;
        }

        nav a {
            text-decoration: none;
            color: #2c3e50;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #3498db;
        }

        /* Hero Section */
        .hero {
            margin-top: 60px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            text-align: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .hero::before,
        .hero::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
        }

        .hero::before {
            width: 300px;
            height: 300px;
            top: -100px;
            left: -100px;
        }

        .hero::after {
            width: 200px;
            height: 200px;
            bottom: -50px;
            right: -50px;
            animation-delay: 2s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(20px); }
        }

        .hero-content {
            position: relative;
            z-index: 2;
            animation: slideInUp 0.8s ease-out;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-image {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #fff;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: zoomIn 0.8s ease-out;
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .hero .subtitle {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            font-weight: 400;
        }

        .hero .description {
            font-size: 1rem;
            margin-bottom: 2rem;
            opacity: 0.95;
        }

        .hero-buttons {
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            padding: 0.9rem 2.5rem;
            margin: 0.5rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #fff;
            color: #667eea;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
        }

        .btn-secondary:hover {
            background: #fff;
            color: #667eea;
        }

        .social-links {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .social-links a {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .social-links a:hover {
            background: #fff;
            color: #667eea;
            transform: translateY(-5px);
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Sections */
        section {
            padding: 5rem 0;
        }

        section h2 {
            font-size: 2.5rem;
            margin-bottom: 3rem;
            text-align: center;
            position: relative;
            font-weight: 700;
            padding-bottom: 1rem;
        }

        section h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: #3498db;
            border-radius: 2px;
        }

        /* About Section */
        #about {
            background: #f8f9fa;
        }

        .about-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
            margin-top: 2rem;
        }

        .about-text h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #2c3e50;
            font-weight: 700;
        }

        .about-text p {
            margin-bottom: 1rem;
            color: #555;
            line-height: 1.8;
        }

        .about-text ul {
            list-style: none;
            margin: 1.5rem 0;
        }

        .about-text ul li {
            margin-bottom: 0.8rem;
            color: #555;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-top: 1.5rem;
        }

        .skill-tag {
            background: #3498db;
            color: #fff;
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .skill-tag:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        /* Research Section */
        #research {
            background: #fff;
        }

        .research-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
            margin-top: 2rem;
        }

        .research-card {
            background: #f8f9fa;
            padding: 2rem;
            border-radius: 10px;
            border-left: 5px solid #3498db;
            transition: all 0.4s ease;
            cursor: pointer;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .research-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            border-left-color: #667eea;
        }

        .research-card h3 {
            color: #3498db;
            margin-bottom: 0.8rem;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .research-card .year {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .research-card p {
            color: #555;
            line-height: 1.7;
        }

        /* Publications Section */
        #publications {
            background: #f8f9fa;
        }

        .pub-list {
            list-style: none;
            margin-top: 2rem;
        }

        .pub-item {
            background: #fff;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-radius: 8px;
            border-left: 4px solid #e74c3c;
            transition: all 0.3s ease;
        }

        .pub-item:hover {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            transform: translateX(5px);
        }

        .pub-item strong {
            color: #2c3e50;
            font-weight: 700;
        }

        .pub-item em {
            color: #7f8c8d;
            font-style: italic;
        }

        .pub-year {
            display: inline-block;
            background: #3498db;
            color: #fff;
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-top: 0.8rem;
            font-weight: 600;
        }

        /* Education Section */
        #education {
            background: #fff;
        }

        .education-timeline {
            position: relative;
            padding: 2rem 0;
            margin-top: 2rem;
        }

        .timeline-item {
            margin-bottom: 3rem;
            padding-left: 3.5rem;
            position: relative;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 25px;
            height: 25px;
            background: #3498db;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 0 0 3px #3498db;
        }

        .timeline-item::after {
            content: '';
            position: absolute;
            left: 11px;
            top: 25px;
            width: 2px;
            height: calc(100% + 2rem);
            background: #3498db;
        }

        .timeline-item:last-child::after {
            display: none;
        }

        .timeline-item h4 {
            color: #2c3e50;
            margin-bottom: 0.3rem;
            font-weight: 700;
        }

        .timeline-item .year {
            color: #3498db;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .timeline-item p {
            color: #555;
            font-size: 0.95rem;
        }

        /* Contact Section */
        #contact {
            background: #2c3e50;
            color: #fff;
            text-align: center;
        }

        #contact h2 {
            color: #fff;
        }

        #contact h2::after {
            background: #3498db;
        }

        .contact-info {
            margin-top: 2rem;
        }

        .contact-info p {
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        .contact-info a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .contact-info a:hover {
            color: #fff;
        }

        /* Footer */
        footer {
            background: #1a252f;
            color: #fff;
            text-align: center;
            padding: 2rem;
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            nav ul {
                display: none;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .hero .subtitle {
                font-size: 1.1rem;
            }

            .about-content {
                grid-template-columns: 1fr;
            }

            .research-grid {
                grid-template-columns: 1fr;
            }

            .hero-image {
                width: 150px;
                height: 150px;
            }

            section h2 {
                font-size: 1.8rem;
            }

            .btn {
                padding: 0.7rem 1.8rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="logo">A<span>S</span></div>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#research">Research</a></li>
            <li><a href="#publications">Publications</a></li>
            <li><a href="#education">Education</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="hero-content">
            <img src="ph.JPG" alt="Arindam Sen" class="hero-image">
            <h1>Arindam Sen</h1>

            <div class="hero-buttons">
                <a href="#about" class="btn btn-primary">Explore My Work</a>
                <a href="#contact" class="btn btn-secondary">Get In Touch</a>
            </div>
